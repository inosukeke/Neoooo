name: CI

# Chạy lint (ruff) + unit test (pytest) mỗi push / pull request.
# KHÔNG chạy integration test (cần Neo4j/GDS/OpenSearch/LLM thật) — pytest.ini
# đã có addopts `-m "not integration"` nên `pytest` mặc định bỏ qua chúng.

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        # deepeval chỉ cần cho live LLM eval (judge), không cần cho unit test —
        # bỏ khỏi CI để nhanh/ổn định; test judge tự `importorskip` khi thiếu.
        run: |
          python -m pip install --upgrade pip
          grep -v '^deepeval' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt
          pip install -e . --no-deps   # package secgraph (editable) — thay PYTHONPATH

      - name: Ruff (lint)
        run: ruff check src/ tests/

      - name: Unit tests (bỏ integration)
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests/ -q

  web-build:
    # UI web Next.js (web/) — bảo đảm lint + type-check + build sạch khi clone.
    # Không cần backend/Neo4j: dữ liệu fetch ở client lúc chạy, không fetch khi build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (next build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
